  # ---------------------------------------------------------------- คำศัพท์
  - name: glossary
    label: คำศัพท์
    type: file
    path: content/data/glossary.json
    format: json
    list: true
    description: "คำที่มีกล่องอธิบายตอนเอาเมาส์ชี้/แตะในบทความ ใช้ในเนื้อหาด้วย [[key|คำ]]"
    fields:
      - name: key
        label: รหัสคำ (key)
        type: string
        required: true
        pattern: "^[a-z0-9_-]+$"
        description: "ภาษาอังกฤษพิมพ์เล็ก ไม่มีเว้นวรรค ห้ามซ้ำ ใช้ในบทความ เช่น pam → [[pam|PAM]] อย่าเปลี่ยนของเดิม เพราะบทความที่ใช้อยู่จะหาคำไม่เจอ"
