# Pages CMS (app.pagescms.org): ตั้งค่าให้แก้เนื้อหาของ The Picture ผ่านหน้าเว็บ แล้วบันทึกลง repo นี้โดยตรง
# เอกสารการตั้งค่า: https://pagescms.org/docs/configuration
#
# หลักการ: แก้ได้เฉพาะ content/ (บทความ + ข้อมูล JSON) และ media/ (รูป) ส่วน src/ เป็นของนักพัฒนา
# เมื่อบันทึก GitHub Actions จะ build (scripts/build.mjs) และ deploy ขึ้น GitHub Pages ให้เอง
#
# ข้อควรรู้ (Pages CMS เขียนไฟล์ใหม่ตามช่องที่ประกาศไว้เท่านั้น): ช่องไหนที่ไม่ได้ประกาศในไฟล์นี้จะหายไปจากไฟล์ข้อมูลตอนบันทึก
# ถ้าเพิ่มช่องใหม่ใน content/data/*.json ต้องเพิ่มช่องนั้นที่นี่ด้วย (scripts/check-pages-config.mjs ตรวจให้)

# ------------------------------------------------------------------ รูป
# อัปโหลดแล้วไปอยู่ใน media/<ประเภท>/ ชื่อไฟล์ถูกสุ่มใหม่ (กันปัญหาชื่อภาษาไทย/ชื่อซ้ำ) รับเฉพาะ jpg, jpeg, png, webp
# build จะย่อเป็น WebP 800 และ 1600 px ให้เอง จึงอัปโหลดไฟล์ใหญ่ได้เลย (ควรกว้างอย่างน้อย 1600 px สำหรับรูปปก)
media:
  - name: covers
    label: รูปปกบทความ
    input: media/covers
    output: /media/covers
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: articles
    label: รูปในเนื้อหาบทความ
    input: media/articles
    output: /media/articles
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: projects
    label: รูปโปรเจกต์
    input: media/projects
    output: /media/projects
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: certificates
    label: รูปเกียรติบัตร
    input: media/certificates
    output: /media/certificates
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: activities
    label: รูปกิจกรรม
    input: media/activities
    output: /media/activities
    extensions: [jpg, jpeg, png, webp]
    rename: random
  - name: profile
    label: รูปโปรไฟล์
    input: media/profile
    output: /media/profile
    extensions: [jpg, jpeg, png, webp]
    rename: random

# ------------------------------------------------------------------ ชุดช่องที่ใช้ซ้ำ
components:
  repair:
    type: object
    fields:
      - name: label
        label: ชื่อวิธีซ่อมแซม
        type: string
        description: "ชื่อที่ขึ้นบนการ์ด เช่น NHEJ (non-homologous end joining)"
      - name: desc
        label: คำอธิบายบนการ์ด
        type: text
        description: "ประโยคสั้นๆ ใต้ชื่อบนการ์ด"
      - name: desc_en
        label: คำอธิบายบนการ์ด (อังกฤษ)
        type: text
        description: "ไม่บังคับ ถ้าเว้นว่างจะแสดงข้อความไทย"
      - name: caption
        label: คำบรรยายใต้แผนภาพ
        type: text
        description: "ข้อความที่ขึ้นใต้แผนภาพตอนอยู่ขั้นที่ 3 ด้วยวิธีนี้"
      - name: caption_en
        label: คำบรรยายใต้แผนภาพ (อังกฤษ)
        type: text
        description: "ไม่บังคับ"

# ------------------------------------------------------------------ เนื้อหา
content:
  # ---------------------------------------------------------------- บทความ
  - name: articles
    label: บทความ
    type: collection
    path: content/articles
    format: yaml-frontmatter
    subfolders: false
    # ชื่อไฟล์ = ที่อยู่ของบทความ (articles/<ชื่อไฟล์>.html) ต้องเป็น a-z 0-9 และ - เท่านั้น
    # ตอนสร้างบทความใหม่ ระบบเสนอชื่อไฟล์จากชื่อเรื่องให้ ถ้าชื่อเรื่องเป็นภาษาไทยให้แก้ช่องชื่อไฟล์เป็นภาษาอังกฤษ เช่น organoid-intro.md
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, category, status, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: ชื่อเรื่อง
        type: string
        required: true
        description: "ชื่อเรื่องเต็ม แสดงเป็นหัวข้อของบทความ"
      - name: dek
        label: คำโปรย
        type: text
        description: "คำโปรย: 1–2 ประโยคที่แสดงบนการ์ดบทความในหน้าแรกและในผลการค้นหา"
      - name: category
        label: หมวด
        type: select
        required: true
        description: "เลือกหมวดของบทความ (ต้องเลือกก่อนเผยแพร่)"
        options:
          values:
            - name: medicine
              label: Medicine (การแพทย์)
            - name: biotech
              label: Biotech (เทคโนโลยีชีวภาพ)
            - name: bioinformatics
              label: Bioinformatics
            - name: ai
              label: AI & Tech
            - name: notes
              label: Study Notes (สรุปเรียน)
      - name: date
        label: วันที่เผยแพร่
        type: date
        required: true
        description: "วันที่ (ค.ศ.) ระบบแสดงเป็น พ.ศ. ให้เองในหน้าเว็บ ใช้เรียงบทความจากใหม่ไปเก่า"
        options:
          format: yyyy-MM-dd
      - name: status
        label: สถานะ
        type: select
        required: true
        description: "ฉบับร่าง = เปิดดูได้ที่ /drafts/<ชื่อไฟล์>.html เท่านั้น ไม่ขึ้นหน้าแรก ไม่ขึ้นการค้นหา และไม่อยู่ใน sitemap / เผยแพร่ = ขึ้นเว็บ"
        options:
          values:
            - name: draft
              label: ฉบับร่าง (ยังไม่เผยแพร่)
            - name: published
              label: เผยแพร่
      - name: featured
        label: บทความเด่น
        type: boolean
        description: "เปิด = เป็นบทความเด่นที่หน้าแรก (ใช้บทความล่าสุดที่เปิดอันเดียว)"
      - name: covers
        label: ภาพปก (สไลด์)
        type: block
        list: true
        blockKey: type
        description: "ภาพปกบนหัวบทความ ใส่หลายอันจะเป็นสไลด์ ใส่อันเดียวเป็นภาพนิ่ง ลำดับบนสุดแสดงก่อน กด 'เพิ่ม' แล้วเลือกชนิด"
        blocks:
          - name: helix
            label: เกลียว DNA (ภาพเคลื่อนไหว ไม่ต้องใช้รูป)
            fields:
              - name: caption
                label: คำบรรยาย
                type: string
                description: "ข้อความใต้ภาพ"
              - name: credit
                label: เครดิต
                type: string
                description: "ภาพวาดโดยระบบ เว้นว่างได้"
          - name: fold
            label: ภาพโปรตีนระบายสี pLDDT (ไม่ต้องใช้รูป)
            fields:
              - name: caption
                label: คำบรรยาย
                type: string
                description: "ข้อความใต้ภาพ"
              - name: credit
                label: เครดิต
                type: string
                description: "ภาพวาดโดยระบบ เว้นว่างได้"
          - name: image
            label: รูปภาพจริง
            fields:
              - name: src
                label: รูป
                type: image
                description: "อัปโหลดหรือเลือกรูปปก (แนะนำสัดส่วน 21:9 หรือ 16:9 กว้างอย่างน้อย 1600 px)"
                options:
                  media: covers
              - name: alt
                label: คำอธิบายรูป (alt)
                type: string
                required: true
                description: "บอกว่าในรูปเห็นอะไร สำหรับคนที่มองไม่เห็นรูป ไม่ใช่ชื่อไฟล์ (บังคับ)"
              - name: caption
                label: คำบรรยาย
                type: string
                description: "ข้อความใต้ภาพ"
              - name: credit
                label: เครดิต
                type: string
                required: true
                description: "ใครเป็นเจ้าของ/มาจากไหน เช่น 'ภาพ: กรวิชญ์ บัวดำ' หรือชื่อผู้สร้างและสัญญาอนุญาต (บังคับ)"
      - name: references
        label: แหล่งอ้างอิง
        type: string
        list: true
        description: "1 ช่อง = 1 รายการ แสดงเป็นรายการเลขท้ายบทความ ใส่ลิงก์ได้แบบ [ชื่อ](https://...)"
      - name: title_en
        label: ชื่อเรื่อง (อังกฤษ)
        type: string
        description: "ไม่บังคับ ใช้ตอนผู้อ่านเลือก EN ถ้าเว้นว่างจะแสดงชื่อไทย"
      - name: dek_en
        label: คำโปรย (อังกฤษ)
        type: text
        description: "ไม่บังคับ"
      - name: short_title
        label: ชื่อสั้น (แท็บเบราว์เซอร์)
        type: string
        description: "ไม่บังคับ ชื่อสั้นที่ขึ้นบนแท็บเบราว์เซอร์ ถ้าเว้นว่างใช้ชื่อเรื่อง"
      - name: lead
        label: ข้อความใต้ชื่อเรื่อง
        type: text
        description: "ไม่บังคับ ข้อความใต้หัวข้อในหน้าบทความ ถ้าเว้นว่างใช้คำโปรย"
      - name: description
        label: คำอธิบายสำหรับแชร์ลิงก์
        type: text
        description: "ไม่บังคับ ข้อความที่ขึ้นเมื่อแชร์ลิงก์ (Facebook, LINE ฯลฯ) และบน Google ถ้าเว้นว่างใช้คำโปรย"
      - name: body
        label: เนื้อหา
        type: code
        description: |
          เขียนเป็น Markdown: ## หัวข้อหลัก, ### หัวข้อย่อย (ต่อท้ายด้วย {#id} ถ้าต้องการลิงก์ตรงหัวข้อ), **ตัวหนา**, > ข้อความเด่น, ตาราง |a|b|
          คำสั่งย่อ (พิมพ์ตามนี้ทุกตัวอักษร):
          • [[key|ข้อความ]] = คำศัพท์ที่มีกล่องอธิบาย key ต้องมีในเมนู 'คำศัพท์' เช่น [[pam|PAM]] (ในตารางให้เขียน [[pam\|PAM]])
          • {{mech}} = แผนภาพกลไก CRISPR-Cas9
          • {{figure src="ไฟล์.jpg" alt="อธิบายรูป" caption="คำบรรยาย" credit="ผู้สร้าง"}} = รูปในเนื้อหา อัปโหลดที่เมนูรูป 'รูปในเนื้อหาบทความ' ก่อน แล้วใส่ชื่อไฟล์ alt และ credit บังคับ
          • {{duo}} **ป้ายซ้าย** ข้อความ --- **ป้ายขวา** ข้อความ {{/duo}} = กล่องเปรียบเทียบสองฝั่ง (แต่ละส่วนอยู่คนละบรรทัด คั่นด้วยบรรทัด ---)
          ย่อหน้าที่มีแค่ [ข้อความในวงเล็บ] คือช่องที่ยังรอข้อมูลจริง
        options:
          format: markdown

  # ---------------------------------------------------------------- โปรเจกต์
  - name: projects
    label: โปรเจกต์
    type: file
    path: content/data/projects.json
    format: json
    list: true
    description: "การ์ดในหน้าโปรเจกต์ (หมายเหตุ: โปรเจกต์ใหม่ต้องมีไฟล์หน้า src/projects/<slug>.html ด้วย ให้นักพัฒนาสร้างให้ ไม่งั้นการ์ดจะลิงก์ไปหน้าที่ไม่มี)"
    fields:
      - name: slug
        label: ที่อยู่ของโปรเจกต์ (slug)
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "ภาษาอังกฤษพิมพ์เล็ก ตัวเลข และ - เท่านั้น ต้องตรงกับชื่อไฟล์หน้า projects/<slug>.html"
      - name: name
        label: ชื่อโปรเจกต์
        type: string
        required: true
        description: "ชื่อที่ขึ้นบนการ์ดและหัวหน้าโปรเจกต์"
      - name: desc_th
        label: คำอธิบาย (ไทย)
        type: text
        description: "1–2 ประโยคบนการ์ด"
      - name: desc_en
        label: คำอธิบาย (อังกฤษ)
        type: text
        description: "ไม่บังคับ"
      - name: types
        label: ประเภท
        type: select
        options:
          multiple: true
          values:
            - name: website
              label: Website
            - name: webapp
              label: Web App
            - name: ai
              label: AI
        description: "เลือกได้หลายประเภท ใช้กรองในหน้าโปรเจกต์"
      - name: tags
        label: แท็ก
        type: string
        list: true
        description: "คำสั้นๆ ที่ขึ้นบนการ์ด เช่น Cell Biology"
      - name: url
        label: ลิงก์เว็บจริง
        type: string
        description: "https://... เว้นว่างได้ (ปุ่มจะขึ้นว่า 'เร็วๆ นี้')"
      - name: github
        label: ลิงก์ GitHub
        type: string
        description: "https://github.com/... เว้นว่างได้"
      - name: thumb
        label: อักษรย่อบนการ์ด
        type: string
        description: "ตัวอักษร 1–2 ตัวที่ขึ้นในกรอบสีบนการ์ด เช่น Nx"

  # ---------------------------------------------------------------- เกียรติบัตร
  - name: certificates
    label: เกียรติบัตร
    type: file
    path: content/data/certificates.json
    format: json
    list: true
    description: "ถ้ามี 4 ใบขึ้นไป หน้าพอร์ตโฟลิโอจะแสดงเป็นแถบเลื่อน ต่ำกว่านั้นเป็นกริด ลบรายการว่างที่เป็นช่องรอข้อมูลออกเมื่อใส่ของจริงแล้ว"
    fields:
      - name: title
        label: ชื่อรายการ
        type: string
        description: "เช่น ชื่อการแข่งขันหรือกิจกรรม"
      - name: title_en
        label: ชื่อรายการ (อังกฤษ)
        type: string
        description: "ไม่บังคับ"
      - name: year
        label: ปี (ค.ศ.)
        type: string
        pattern:
          regex: "^(\\d{4})?$"
          message: "ใส่ปี ค.ศ. 4 หลัก เช่น 2025 (หน้าเว็บแสดงเป็น พ.ศ. ให้เอง)"
        description: "ปี ค.ศ. 4 หลัก เช่น 2025"
      - name: image
        label: รูปเกียรติบัตร
        type: image
        description: "อัปโหลดหรือเลือกรูปเกียรติบัตร"
        options:
          media: certificates
      - name: alt
        label: คำอธิบายรูป (alt)
        type: string
        required: true
        description: "บอกว่าเป็นเกียรติบัตรอะไร จากใคร สำหรับคนที่มองไม่เห็นรูป (บังคับ)"
      - name: credit
        label: เครดิต
        type: string
        required: true
        description: "ผู้ออกเกียรติบัตร/แหล่งที่มาของรูป (บังคับ)"

  # ---------------------------------------------------------------- กิจกรรม
  - name: activities
    label: กิจกรรม (ห้องปฏิบัติการและกิจกรรม)
    type: file
    path: content/data/activities.json
    format: json
    list: true
    description: "การ์ดในส่วน 'ห้องปฏิบัติการและกิจกรรม' ของหน้าพอร์ตโฟลิโอ"
    fields:
      - name: cat
        label: เวอร์ชันพอร์ตโฟลิโอ
        type: string
        description: "bio = แสดงในเวอร์ชันชีววิทยา, chem = เคมี, ใส่ทั้งคู่คั่นด้วยเว้นวรรค (bio chem) ค่าอื่นๆ (เช่น physics, stem) จะแสดงเมื่อไม่ได้เลือกเวอร์ชัน"
      - name: kicker
        label: ป้ายเล็กบนหัวการ์ด
        type: string
        description: "คำสั้นๆ เช่น Lab, Experiment, STEM"
      - name: title
        label: ชื่อกิจกรรม
        type: string
        required: true
        description: "ชื่อกิจกรรมที่ขึ้นบนการ์ด"
      - name: title_en
        label: ชื่อกิจกรรม (อังกฤษ)
        type: string
        description: "ไม่บังคับ"
      - name: text
        label: คำอธิบาย
        type: text
        description: "1–2 ประโยค ทำอะไร ได้อะไร"
      - name: text_en
        label: คำอธิบาย (อังกฤษ)
        type: text
        description: "ไม่บังคับ"
      - name: image
        label: รูปกิจกรรม
        type: image
        description: "อัปโหลดหรือเลือกรูปกิจกรรม"
        options:
          media: activities
      - name: alt
        label: คำอธิบายรูป (alt)
        type: string
        required: true
        description: "บอกว่าในรูปเห็นอะไร สำหรับคนที่มองไม่เห็นรูป (บังคับ)"
      - name: credit
        label: เครดิต
        type: string
        required: true
        description: "ใครถ่ายภาพ/แหล่งที่มา เช่น 'ภาพ: กรวิชญ์ บัวดำ' (บังคับ)"

  # ---------------------------------------------------------------- รางวัล
  - name: awards
    label: รางวัล (สถิติเด่นและรายการรางวัล)
    type: file
    path: content/data/awards.json
    format: json
    fields:
      - name: stats
        label: สถิติเด่น (กล่องใหญ่ใต้ปุ่มเวอร์ชัน)
        type: object
